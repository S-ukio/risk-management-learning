<text x="92" y="141" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="126" y="112" width="520" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="146" y="134" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">device_register</text>
<text x="146" y="152" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">获取 device_id / iid（klink.amemv.com）</text>
<rect x="674" y="121" width="92" height="30" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/><text x="720.0" y="139.78" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">身份</text>
<circle cx="92" cy="202" r="15" fill="#2563eb" />
<text x="92" y="207" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="126" y="178" width="520" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="146" y="200" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">device_report</text>
<text x="146" y="218" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#475569" font-weight="400" text-anchor="start">Perseus 设备报告</text>
<rect x="674" y="187" width="92" height="30" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/><text x="720.0" y="205.78" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#2563eb" font-weight="600" text-anchor="middle">报告</text>
<circle cx="92" cy="268" r="15" fill="#2563eb" />
<text x="92" y="273" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="126" y="244" width="520" height="50" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="146" y="266" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" fill="#0f172a" font-weight="700" text-anchor="start">app_log</text>
