<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">How device identity is exchanged</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
  <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
  </marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">How device identity is exchanged</text>
<text x="40" y="72" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">Registration trades local declarations plus a full fingerprint for server-issued identity and credentials.</text>
<rect x="50" y="108" width="340" height="210" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
<text x="70" y="140" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#2563eb" font-weight="700" text-anchor="start">Local declarations (client-generated)</text>
<rect x="70" y="162" width="300" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="220" y="185" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">openudid</text>
<text x="220" y="204" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">device-level · first report</text>
<rect x="70" y="232" width="300" height="54" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
<text x="220" y="255" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle">cdid</text>
<text x="220" y="274" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10.5" fill="#475569" font-weight="400" text-anchor="middle">install-level · uppercase UUID</text>
<rect x="590" y="108" width="340" height="210" rx="14" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="610" y="140" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#047857" font-weight="700" text-anchor="start">Server-issued (trust in the declaration)</text>
<rect x="610" y="158" width="300" height="42" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="760" y="176" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">device_id</text>
<text x="760" y="191" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">device-level · long-lived</text>
<rect x="610" y="210" width="300" height="42" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="760" y="228" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">iid</text>
<text x="760" y="243" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">install-level</text>
<rect x="610" y="262" width="300" height="42" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="760" y="280" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12.5" fill="#0f172a" font-weight="600" text-anchor="middle">sec_device_token</text>
<text x="760" y="295" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="10" fill="#475569" font-weight="400" text-anchor="middle">device-level credential</text>
<line x1="390" y1="175" x2="590" y2="175" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<text x="490" y="163" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#2563eb" font-weight="600" text-anchor="middle">register: IDs + fingerprint</text>
<line x1="590" y1="265" x2="390" y2="265" stroke="#047857" stroke-width="2" marker-end="url(#arrGreen)"/>
<text x="490" y="253" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#047857" font-weight="600" text-anchor="middle">response: identity + token</text>
<rect x="50" y="348" width="880" height="48" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="70" y="378" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" fill="#1e3a8a" font-weight="600" text-anchor="start">One-way trust: device_id / iid cannot be forged locally; changing the app version rebuilds the token system.</text>
</svg>
