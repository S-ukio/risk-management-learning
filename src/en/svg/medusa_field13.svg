<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">Medusa field13: two generations</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
  <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
  </marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Medusa field13: two generations</text>
<text x="40" y="72" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">The input is a fixed 52-byte message; old builds pick the branch from content, 41.1/41.2 pick it from khronos.</text>
<rect x="726" y="88" width="220" height="64" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="836" y="127" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle">msg52 (52B)</text>
<rect x="40" y="92" width="200" height="54" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/><text x="140.0" y="123.32" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">query_sm3 (32B)</text>
<line x1="140" y1="146" x2="140" y2="168" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="270" y="92" width="200" height="54" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/><text x="370.0" y="123.32" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">body_md5 (16B)</text>
<line x1="370" y1="146" x2="370" y2="168" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="500" y="92" width="200" height="54" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.2"/><text x="600.0" y="123.32" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="12" fill="#0f172a" font-weight="600" text-anchor="middle">khronos_le (4B)</text>
<line x1="600" y1="146" x2="600" y2="168" stroke="#93c5fd" stroke-width="1.5"/>
<line x1="140" y1="168" x2="836" y2="168" stroke="#93c5fd" stroke-width="1.5"/>
<line x1="836" y1="168" x2="836" y2="155" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="40" y="190" width="960" height="130" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
<text x="60" y="220" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#b45309" font-weight="700" text-anchor="start">Old ≤40.x · content-driven</text>
<rect x="60" y="238" width="170" height="42" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/><text x="145.0" y="262.96" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">52B mix function</text>
<line x1="230" y1="259" x2="254" y2="259" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrAmber)"/>
<rect x="260" y="238" width="120" height="42" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/><text x="320.0" y="262.96" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">slot 0–15</text>
<line x1="380" y1="259" x2="404" y2="259" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrAmber)"/>
<rect x="410" y="238" width="170" height="42" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/><text x="495.0" y="262.96" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">slot % 3 → 3 families</text>
<line x1="580" y1="259" x2="594" y2="259" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrAmber)"/>
<rect x="600" y="238" width="160" height="42" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.2"/><text x="680.0" y="262.96" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">20B output</text>
<text x="60" y="306" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#92400e" font-weight="400" text-anchor="start">SHA-256 / Whirlpool / MD5; per-branch constants and rounds</text>
<rect x="40" y="344" width="960" height="142" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<text x="60" y="374" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#047857" font-weight="700" text-anchor="start">New 41.1 / 41.2 · khronos-driven</text>
<rect x="60" y="392" width="210" height="42" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/><text x="165.0" y="416.96" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">slot = (khronos ^ 52) &amp; 15</text>
<line x1="270" y1="413" x2="294" y2="413" stroke="#047857" stroke-width="1.6" marker-end="url(#arrGreen)"/>
<rect x="300" y="392" width="140" height="42" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/><text x="370.0" y="416.96" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">slot &amp; 3 → 4 families</text>
<line x1="440" y1="413" x2="464" y2="413" stroke="#047857" stroke-width="1.6" marker-end="url(#arrGreen)"/>
<rect x="470" y="392" width="210" height="42" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/><text x="575.0" y="416.96" font-family="Cascadia Mono, Consolas, Menlo, monospace" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">32B → 16B core + 4B tail</text>
<line x1="680" y1="413" x2="704" y2="413" stroke="#047857" stroke-width="1.6" marker-end="url(#arrGreen)"/>
<rect x="710" y="392" width="140" height="42" rx="8" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/><text x="780.0" y="416.96" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">20B field13</text>
<text x="60" y="470" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#065f46" font-weight="400" text-anchor="start">SHA-256 / Whirlpool / BLAKE2b / MD5; constants derived by khronos rotation</text>
<rect x="40" y="506" width="960" height="46" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="60" y="535" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#7f1d1d" font-weight="600" text-anchor="start">Never mix generations: the request version and the field13 derivation must match, or the server recomputation will disagree.</text>
</svg>
