<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" role="img" aria-labelledby="diagram-title">
<title id="diagram-title">Three-layer risk-control model</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
  </marker>
  <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
  </marker>
  <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
  </marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="24" fill="#0f172a" font-weight="700" text-anchor="start">Three-layer risk-control model</text>
<text x="40" y="72" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" fill="#475569" font-weight="400" text-anchor="start">If any layer fails, the request is downgraded. The common failure is inconsistent state, not a broken algorithm.</text>
<rect x="44" y="100" width="640" height="76" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
<rect x="44" y="100" width="7" height="76" rx="3" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="68" y="131" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Device</text>
<text x="68" y="155" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">Is the device real, and is its identity trustworthy?</text>
<rect x="350" y="122" width="98" height="32" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="399.0" y="142.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">fingerprint</text>
<rect x="456" y="122" width="98" height="32" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="505.0" y="142.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">SDI token</text>
<rect x="562" y="122" width="98" height="32" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/><text x="611.0" y="142.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">TicketGuard</text>
<line x1="684" y1="138" x2="736" y2="138" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrGray)" stroke-dasharray="4 3"/>
<rect x="44" y="192" width="640" height="76" rx="12" fill="#f8fafc" stroke="#047857" stroke-width="1.5"/>
<rect x="44" y="192" width="7" height="76" rx="3" fill="#047857" stroke="#047857" stroke-width="1.5"/>
<text x="68" y="223" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Network</text>
<text x="68" y="247" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">Does the connection look like a genuine client?</text>
<rect x="350" y="214" width="98" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="399.0" y="234.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">TLS profile</text>
<rect x="456" y="214" width="98" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="505.0" y="234.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">HTTP/2</text>
<rect x="562" y="214" width="98" height="32" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.2"/><text x="611.0" y="234.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">cronet version</text>
<line x1="684" y1="230" x2="736" y2="230" stroke="#047857" stroke-width="1.6" marker-end="url(#arrGray)" stroke-dasharray="4 3"/>
<rect x="44" y="284" width="640" height="76" rx="12" fill="#f8fafc" stroke="#b45309" stroke-width="1.5"/>
<rect x="44" y="284" width="7" height="76" rx="3" fill="#b45309" stroke="#b45309" stroke-width="1.5"/>
<text x="68" y="315" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="16" fill="#0f172a" font-weight="700" text-anchor="start">Behavior</text>
<text x="68" y="339" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#475569" font-weight="400" text-anchor="start">Are timing and state self-consistent?</text>
<rect x="350" y="306" width="98" height="32" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text x="399.0" y="326.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">signature headers</text>
<rect x="456" y="306" width="98" height="32" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text x="505.0" y="326.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">clock consistency</text>
<rect x="562" y="306" width="98" height="32" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/><text x="611.0" y="326.14" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11.5" fill="#0f172a" font-weight="600" text-anchor="middle">session state</text>
<line x1="684" y1="322" x2="736" y2="322" stroke="#b45309" stroke-width="1.6" marker-end="url(#arrGray)" stroke-dasharray="4 3"/>
<line x1="736" y1="138" x2="736" y2="322" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
<text x="752" y="240" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="15" fill="#2563eb" font-weight="800" text-anchor="start">AND</text>
<rect x="788" y="100" width="150" height="260" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="863" y="128" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="12.5" fill="#2563eb" font-weight="700" text-anchor="middle">Decision &amp; downgrade</text>
<rect x="802" y="148" width="122" height="34" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="863.0" y="168.96" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">empty page</text>
<rect x="802" y="196" width="122" height="34" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="863.0" y="216.96" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">captcha</text>
<rect x="802" y="244" width="122" height="34" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="863.0" y="264.96" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">rate limit</text>
<rect x="802" y="292" width="122" height="34" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="863.0" y="312.96" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="11" fill="#0f172a" font-weight="600" text-anchor="middle">hard reject</text>
<rect x="44" y="394" width="894" height="48" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="64" y="424" font-family="Segoe UI, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13.5" fill="#7c2d12" font-weight="600" text-anchor="start">All three layers are ANDed: real device + real link + consistent behavior.</text>
</svg>
