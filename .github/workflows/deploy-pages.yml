name: Deploy mdBook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.4'

      - name: Build Chinese book
        run: mdbook build

      - name: Build English book
        run: |
          cp book.toml book.toml.zh_bak
          trap 'cp book.toml.zh_bak book.toml; rm -f book.toml.zh_bak' EXIT
          cp book-en.toml book.toml
          mdbook build
          cp book.toml.zh_bak book.toml
          rm -f book.toml.zh_bak
          trap - EXIT

      - name: Add bilingual landing page
        run: cp root-index.html book/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
